<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDF0CD" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A15" />
    </radialGradient>
  </defs>
  <g fill="none" stroke="url(#goldGrad)" stroke-width="1.5">
    <circle cx="100" cy="100" r="92" stroke-dasharray="3,3" opacity="0.6"/>
    <circle cx="100" cy="100" r="84" stroke-width="1"/>
    <circle cx="100" cy="100" r="76" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="48" stroke-width="1"/>
    <circle cx="100" cy="100" r="24" fill="url(#goldGrad)" fill-opacity="0.15" stroke-width="1.5"/>
    <circle cx="100" cy="100" r="8" fill="url(#goldGrad)"/>

    <!-- 8 Petals radiating outwards -->
    <g transform="translate(100,100)">
      <path d="M0,-24 Q18,-50 0,-76 Q-18,-50 0,-24 Z" fill="url(#goldGrad)" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="1.2"/>
      <path d="M0,-24 Q18,-50 0,-76 Q-18,-50 0,-24 Z" transform="rotate(45)" fill="url(#goldGrad)" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="1.2"/>
      <path d="M0,-24 Q18,-50 0,-76 Q-18,-50 0,-24 Z" transform="rotate(90)" fill="url(#goldGrad)" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="1.2"/>
      <path d="M0,-24 Q18,-50 0,-76 Q-18,-50 0,-24 Z" transform="rotate(135)" fill="url(#goldGrad)" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="1.2"/>
      <path d="M0,-24 Q18,-50 0,-76 Q-18,-50 0,-24 Z" transform="rotate(180)" fill="url(#goldGrad)" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="1.2"/>
      <path d="M0,-24 Q18,-50 0,-76 Q-18,-50 0,-24 Z" transform="rotate(225)" fill="url(#goldGrad)" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="1.2"/>
      <path d="M0,-24 Q18,-50 0,-76 Q-18,-50 0,-24 Z" transform="rotate(270)" fill="url(#goldGrad)" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="1.2"/>
      <path d="M0,-24 Q18,-50 0,-76 Q-18,-50 0,-24 Z" transform="rotate(315)" fill="url(#goldGrad)" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="1.2"/>
    </g>

    <!-- Outer flourishes -->
    <g transform="translate(100,100)" stroke-width="1">
      <circle cx="0" cy="-84" r="3" fill="url(#goldGrad)"/>
      <circle cx="59.4" cy="-59.4" r="3" fill="url(#goldGrad)"/>
      <circle cx="84" cy="0" r="3" fill="url(#goldGrad)"/>
      <circle cx="59.4" cy="59.4" r="3" fill="url(#goldGrad)"/>
      <circle cx="0" cy="84" r="3" fill="url(#goldGrad)"/>
      <circle cx="-59.4" cy="59.4" r="3" fill="url(#goldGrad)"/>
      <circle cx="-84" cy="0" r="3" fill="url(#goldGrad)"/>
      <circle cx="-59.4" cy="-59.4" r="3" fill="url(#goldGrad)"/>
    </g>
  </g>
</svg>
